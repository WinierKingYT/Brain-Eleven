version: '3.8'

services:
  # Main API Application
  app:
    build: .
    container_name: brain-eleven-api
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test}
      VAULT_PATH: /vault
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brain_eleven}
      # search-api.py defaults to binding 127.0.0.1 for safety; inside the
      # container that would make the port mapping below unreachable, so
      # bind 0.0.0.0 here - Docker's own network isolation is the actual
      # boundary in this deployment, not the process bind address.
      BRAIN_ELEVEN_HOST: 0.0.0.0
      # Unset by default (docker-compose leaves ${VAR} empty if the host
      # env doesn't have it) - every endpoint except /health is then
      # unauthenticated. Set BRAIN_ELEVEN_API_KEY in your shell or a .env
      # file before exposing this beyond localhost.
      BRAIN_ELEVEN_API_KEY: ${BRAIN_ELEVEN_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - ./data/vault:/vault
      - ./.claude:/app/.claude
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - brain-network
    restart: unless-stopped

  # Redis Cache Layer
  redis:
    image: redis:7-alpine
    container_name: brain-eleven-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - brain-network
    restart: unless-stopped

  # PostgreSQL Database (Optional)
  postgres:
    image: postgres:16-alpine
    container_name: brain-eleven-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-brain_eleven}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brain}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - brain-network
    restart: unless-stopped

  # Neo4j Knowledge Graph (Optional - for Phase 11)
  # neo4j:
  #   image: neo4j:5.15
  #   container_name: brain-eleven-neo4j
  #   ports:
  #     - "7687:7687"
  #     - "7474:7474"
  #   environment:
  #     NEO4J_AUTH: neo4j/password
  #     NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
  #   volumes:
  #     - neo4j_data:/data
  #   networks:
  #     - brain-network
  #   restart: unless-stopped

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  # neo4j_data:
  #   driver: local

networks:
  brain-network:
    driver: bridge
