[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-eleven"
version = "3.0.0"
description = "Local privacy-first second-brain memory and context system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = [
    "brain_eleven*",
    "context_router*",
    "authority*",
    "context_compiler_v2*",
    "context_density_v2*",
    "retrieval_decision_v2*",
    "evals*",
]
