[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-eleven"
version = "1.4.0"
description = "Local privacy-first second-brain memory and context system"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.23.2",
    "pydantic==2.12.5",
    "httpx==0.27.2",
    "httpx2==2.13.1",
    "numpy==2.4.2",
    "openai==2.24.0",
    "networkx==3.6.1",
    "python-ulid==4.0.1",
]

[project.optional-dependencies]
probe = [
    "sentence-transformers>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = [
    "brain_eleven*",
    "scripts*",
]
