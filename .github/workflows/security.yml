name: Security Scan

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

jobs:
  bandit:
    runs-on: ubuntu-latest
    name: Bandit Security Scan

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit[toml]

    - name: Run Bandit
      run: |
        bandit -r scripts -f json -o bandit-report.json
        bandit -r scripts -f txt
      continue-on-error: true

    - name: Upload Bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-report
        path: bandit-report.json

  secrets:
    runs-on: ubuntu-latest
    name: Secret Detection

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install detect-secrets
      run: |
        python -m pip install --upgrade pip
        pip install detect-secrets

    - name: Scan for secrets
      run: |
        # .secrets.baseline isn't committed (it's meant to be generated once
        # and reviewed, not hand-maintained) - without this check, every run
        # failed with exit code 2 before ever comparing anything, since
        # `--baseline` requires the file to already exist.
        if [ ! -f .secrets.baseline ]; then
          detect-secrets scan > .secrets.baseline
        fi
        detect-secrets scan --baseline .secrets.baseline
      continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Security Check

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install safety
      run: |
        python -m pip install --upgrade pip
        pip install safety

    - name: Check dependencies
      run: |
        safety check --json
      continue-on-error: true

  docker-scan:
    runs-on: ubuntu-latest
    name: Docker Image Security Scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Uploading SARIF to the Security tab needs this explicitly - the
    # default GITHUB_TOKEN doesn't carry security-events write access,
    # which is why every prior run failed with "Resource not accessible
    # by integration" on the upload step.
    permissions:
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: brain-eleven:scan

    - name: Run Trivy scan
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: brain-eleven:scan
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
