name: Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Fatal lint errors only
        if: runner.os == 'Linux'
        run: |
          python -m pip install flake8
          flake8 brain_eleven scripts context_router authority context_compiler_v2 retrieval_decision_v2 context_density_v2 tests --count --select=E9,F63,F7,F82 --show-source
      - name: Run tests
        run: python -m pytest tests -q
