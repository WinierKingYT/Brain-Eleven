name: Validation

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio flake8
      - name: Reject fatal lint errors
        if: matrix.os == 'ubuntu-latest'
        run: >-
          flake8 scripts tests --count --select=E9,F63,F7,F82
          --show-source --statistics
      - name: Report advisory lint metrics
        if: matrix.os == 'ubuntu-latest'
        run: >-
          flake8 scripts tests --count --exit-zero --max-complexity=10
          --max-line-length=127 --statistics
      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m "not integration"

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brain_eleven
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio
      - name: Run API integration tests
        run: pytest tests/ -v --tb=short -m integration

  quality:
    name: Coverage gate
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio
      - name: Enforce coverage threshold
        run: |
          pytest tests/ --cov=scripts --cov-report=xml --cov-report=html --cov-report=term-missing --junitxml=pytest-results.xml
          coverage report --fail-under=80
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            pytest-results.xml

  bandit:
    name: Bandit security scan
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Bandit
        run: python -m pip install --upgrade pip 'bandit[toml]'
      - name: Run Bandit hard gate
        run: bandit -r scripts -f json -o bandit-report.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  secrets:
    name: Secret detection
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install detect-secrets
        run: python -m pip install --upgrade pip detect-secrets
      - name: Verify reviewed baseline exists
        run: test -f .secrets.baseline
      - name: Reject unreviewed secret candidates
        run: detect-secrets scan --baseline .secrets.baseline

  dependency-audit:
    name: Dependency security check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run dependency audit hard gate
        run: >-
          python scripts/dependency_audit.py
          --requirements requirements.txt
          --report dependency-audit-report.json
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: dependency-audit-report.json

  docker-security:
    name: Docker image security scan
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: brain-eleven:validation
      - name: Run Trivy hard gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brain-eleven:validation
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: 'true'
          # Python libraries are hard-gated by pip-audit against the resolved
          # requirements. Limit image scanning to OS packages so deleted,
          # vulnerable records in immutable base layers cannot shadow patched
          # runtime distributions in the final filesystem.
          vuln-type: os
          exit-code: '1'
          ignore-unfixed: 'false'
          trivyignores: .trivyignore
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  graduation-evidence:
    name: Phase 14 graduation evidence
    needs: [bandit, secrets, dependency-audit, docker-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install evidence parser
        run: python -m pip install --upgrade pip defusedxml==0.7.1
      - name: Download runtime test evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .evidence-input
      - name: Generate evidence after security gates
        run: >-
          python scripts/graduation_evidence.py collect
          --junit .evidence-input/pytest-results.xml
          --coverage .evidence-input/coverage.xml
          --security-status PASS
          --output .phase-evidence/phase14-graduation.json
      - name: Upload graduation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase14-graduation-evidence
          path: .phase-evidence/phase14-graduation.json
