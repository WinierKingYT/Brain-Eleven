name: Validation

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio flake8
      - name: Reject fatal lint errors
        if: matrix.os == 'ubuntu-latest'
        run: >-
          flake8 scripts context_router authority context_compiler_v2 evals tests --count --select=E9,F63,F7,F82
          --show-source --statistics
      - name: Report advisory lint metrics
        if: matrix.os == 'ubuntu-latest'
        run: >-
          flake8 scripts context_router authority context_compiler_v2 evals tests --count --exit-zero --max-complexity=10
          --max-line-length=127 --statistics
      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m "not integration and not graduation"

  integration:
    name: Integration tests
    needs: unit
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports:
          - 6379:6379
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brain_eleven
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio
      - name: Run API integration tests
        run: pytest tests/ -v --tb=short -m integration

  context-privacy:
    name: Context-engine privacy audit
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Verify content-free derived outputs and safe rendering
        run: >-
          pytest tests/test_context_engine_operational_surfaces.py tests/test_context_router.py
          tests/test_authority_resolver.py tests/test_context_compiler_v2.py
          --junitxml=context-privacy-junit.xml
      - name: Upload privacy audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-engine-privacy-audit
          path: context-privacy-junit.xml
          if-no-files-found: error

  evaluation-smoke:
    name: Evaluation smoke suite
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run deterministic evaluation smoke suite
        run: >-
          python -m evals.run --provider baseline --suite smoke --corpus-root evals/corpus-v2
          --report evaluation-smoke-report.json
      - name: Upload evaluation smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-smoke-report
          path: evaluation-smoke-report.json
          if-no-files-found: error

  evaluation-public:
    name: Evaluation public suite
    needs: evaluation-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run deterministic public evaluation suite
        run: >-
          python -m evals.run --provider baseline --suite public --corpus-root evals/corpus-v2
          --report evaluation-public-report.json
      - name: Upload public evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-public-report
          path: evaluation-public-report.json
          if-no-files-found: error

  task-state-smoke:
    name: Phase 16 task/state smoke suite
    needs: evaluation-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run deterministic task/state smoke suite
        run: >-
          python -m evals.task_state_eval --suite smoke
          --report task-state-smoke-report.json
      - name: Upload task/state smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-state-smoke-report
          path: task-state-smoke-report.json
          if-no-files-found: error

  phase15-evidence:
    name: Phase 15 evaluation evidence
    needs: [bandit, secrets, dependency-audit, docker-security, context-privacy, evaluation-public]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt defusedxml==0.7.1
      - name: Download runtime test evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .phase15-evidence-input
      - name: Verify immutable historical baseline
        run: python -m evals.baseline_snapshot --baseline baseline-v1 --check
      - name: Verify current compatibility baseline
        run: python -m evals.baseline_snapshot --baseline baseline-v2 --check
      - name: Run full public and holdout evaluation
        run: >-
          python -m evals.run --provider baseline --suite all --corpus-root evals/corpus-v2
          --report .phase15-evidence-input/baseline-v2-all-report.json
      - name: Generate Phase 15 evidence
        run: >-
          python scripts/phase15_evidence.py
          --junit .phase15-evidence-input/pytest-results.xml
          --baseline evals/reports/baseline-v2.json
          --evaluation .phase15-evidence-input/baseline-v2-all-report.json
          --output .phase-evidence/phase15-evaluation.json
      - name: Upload Phase 15 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-evaluation-evidence
          path: .phase-evidence/phase15-evaluation.json
          if-no-files-found: error

  task-state-public:
    name: Phase 16 task/state public suite
    needs: [evaluation-public, task-state-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run deterministic task/state public suite
        run: >-
          python -m evals.task_state_eval --suite public
          --report task-state-public-report.json
      - name: Upload task/state public report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-state-public-report
          path: task-state-public-report.json
          if-no-files-found: error

  router-smoke:
    name: Phase 17 router shadow smoke suite
    needs: [evaluation-smoke, task-state-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run route-policy expectations
        run: >-
          python -m evals.router_evaluation
          --report router-route-smoke-report.json
      - name: Run Router provider smoke corpus
        run: >-
          python -m evals.run --provider router --suite smoke --corpus-root evals/corpus-v2
          --report router-selection-smoke-report.json
      - name: Compare baseline and Router in shadow mode
        run: >-
          python -m evals.router_shadow --suite smoke --corpus-root evals/corpus-v2
          --output router-shadow-smoke-report.json
      - name: Upload router smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-router-smoke-reports
          path: |
            router-route-smoke-report.json
            router-selection-smoke-report.json
            router-shadow-smoke-report.json
          if-no-files-found: error

  router-public:
    name: Phase 17 router public suite
    needs: [evaluation-public, router-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Router public corpus
        run: >-
          python -m evals.run --provider router --suite public --corpus-root evals/corpus-v2
          --report router-selection-public-report.json
      - name: Compare public baseline and Router in shadow mode
        run: >-
          python -m evals.router_shadow --suite public --corpus-root evals/corpus-v2
          --output router-shadow-public-report.json
      - name: Upload router public reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-router-public-reports
          path: |
            router-selection-public-report.json
            router-shadow-public-report.json
          if-no-files-found: error

  authority-smoke:
    name: Phase 18 authority shadow smoke suite
    needs: [router-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run metadata authority smoke corpus
        run: >-
          python -m evals.authority_evaluation --suite smoke
          --output authority-policy-smoke-report.json
      - name: Run authority provider smoke corpus
        run: >-
          python -m evals.run --provider authority --suite smoke --corpus-root evals/corpus-v2
          --report authority-selection-smoke-report.json
      - name: Compare Router and authority in shadow mode
        run: >-
          python -m evals.authority_shadow --suite smoke --corpus-root evals/corpus-v2
          --output authority-shadow-smoke-report.json
      - name: Upload authority smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-authority-smoke-reports
          path: |
            authority-policy-smoke-report.json
            authority-selection-smoke-report.json
            authority-shadow-smoke-report.json
          if-no-files-found: error

  authority-public:
    name: Phase 18 authority public suite
    needs: [router-public, authority-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run metadata authority public corpus
        run: >-
          python -m evals.authority_evaluation --suite public
          --output authority-policy-public-report.json
      - name: Run authority provider public corpus
        run: >-
          python -m evals.run --provider authority --suite public --corpus-root evals/corpus-v2
          --report authority-selection-public-report.json
      - name: Compare public Router and authority in shadow mode
        run: >-
          python -m evals.authority_shadow --suite public --corpus-root evals/corpus-v2
          --output authority-shadow-public-report.json
      - name: Upload authority public reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-authority-public-reports
          path: |
            authority-policy-public-report.json
            authority-selection-public-report.json
            authority-shadow-public-report.json
          if-no-files-found: error

  compiler-v2-smoke:
    name: Phase 19 compiler V2 shadow smoke suite
    needs: [authority-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run compiler policy smoke corpus
        run: >-
          python -m evals.compiler_v2_evaluation --suite smoke
          --output compiler-v2-policy-smoke-report.json
      - name: Run compiler V2 provider smoke corpus
        run: >-
          python -m evals.run --provider compiler-v2 --suite smoke --corpus-root evals/corpus-v2
          --report compiler-v2-selection-smoke-report.json
      - name: Compare V1 and V2 in shadow mode
        run: >-
          python -m evals.compiler_v2_shadow --suite smoke --corpus-root evals/corpus-v2
          --output compiler-v2-shadow-smoke-report.json
      - name: Upload compiler V2 smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-compiler-v2-smoke-reports
          path: |
            compiler-v2-policy-smoke-report.json
            compiler-v2-selection-smoke-report.json
            compiler-v2-shadow-smoke-report.json
          if-no-files-found: error

  compiler-v2-public:
    name: Phase 19 compiler V2 public suite
    needs: [authority-public, compiler-v2-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run compiler V2 provider public corpus
        run: >-
          python -m evals.run --provider compiler-v2 --suite public --corpus-root evals/corpus-v2
          --report compiler-v2-selection-public-report.json
      - name: Compare public V1 and V2 shadow outputs
        run: >-
          python -m evals.compiler_v2_shadow --suite public --corpus-root evals/corpus-v2
          --output compiler-v2-shadow-public-report.json
      - name: Upload compiler V2 public reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-compiler-v2-public-reports
          path: |
            compiler-v2-selection-public-report.json
            compiler-v2-shadow-public-report.json
          if-no-files-found: error

  phase16-evidence:
    name: Phase 16 task/state evidence
    needs: [bandit, secrets, dependency-audit, docker-security, context-privacy, phase15-evidence, task-state-public]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt defusedxml==0.7.1
      - name: Download runtime test evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .phase16-evidence-input
      - name: Run full task/state evaluation suite
        run: >-
          python -m evals.task_state_eval --suite all
          --report .phase16-evidence-input/task-state-all-report.json
      - name: Generate Phase 16 evidence
        run: >-
          python scripts/phase16_evidence.py
          --junit .phase16-evidence-input/pytest-results.xml
          --evaluation .phase16-evidence-input/task-state-all-report.json
          --output .phase-evidence/phase16-task-state.json
      - name: Upload Phase 16 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase16-task-state-evidence
          path: .phase-evidence/phase16-task-state.json
          if-no-files-found: error

  phase17-evidence:
    name: Phase 17 router evidence
    needs: [bandit, secrets, dependency-audit, docker-security, context-privacy, phase15-evidence, router-public]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt defusedxml==0.7.1
      - name: Download runtime test evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .phase17-evidence-input
      - name: Run full Router corpus including holdout
        run: >-
          python -m evals.run --provider router --suite all --corpus-root evals/corpus-v2
          --report .phase17-evidence-input/router-selection-all-report.json
      - name: Run route policy expectations
        run: >-
          python -m evals.router_evaluation
          --report .phase17-evidence-input/router-route-report.json
      - name: Produce content-free full shadow comparison
        run: >-
          python -m evals.router_shadow --suite all --corpus-root evals/corpus-v2
          --output .phase17-evidence-input/router-shadow-report.json
      - name: Measure informational Router performance
        run: >-
          python -m evals.router_benchmark
          --output .phase17-evidence-input/router-benchmark.json
      - name: Generate Phase 17 evidence
        run: >-
          python scripts/phase17_evidence.py
          --junit .phase17-evidence-input/pytest-results.xml
          --route-evaluation .phase17-evidence-input/router-route-report.json
          --selection-evaluation .phase17-evidence-input/router-selection-all-report.json
          --shadow-report .phase17-evidence-input/router-shadow-report.json
          --benchmark .phase17-evidence-input/router-benchmark.json
          --output .phase-evidence/phase17-task-aware-router.json
      - name: Upload Phase 17 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase17-task-aware-router-evidence
          path: .phase-evidence/phase17-task-aware-router.json
          if-no-files-found: error

  phase18-evidence:
    name: Phase 18 authority evidence
    needs: [bandit, secrets, dependency-audit, docker-security, context-privacy, phase15-evidence, authority-public]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt defusedxml==0.7.1
      - name: Download runtime test evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .phase18-evidence-input
      - name: Run full metadata authority corpus including holdout
        run: >-
          python -m evals.authority_evaluation --suite all
          --output .phase18-evidence-input/authority-policy-all-report.json
      - name: Run full authority selection evaluation
        run: >-
          python -m evals.run --provider authority --suite all --corpus-root evals/corpus-v2
          --report .phase18-evidence-input/authority-selection-all-report.json
      - name: Produce content-free full authority shadow comparison
        run: >-
          python -m evals.authority_shadow --suite all --corpus-root evals/corpus-v2
          --output .phase18-evidence-input/authority-shadow-report.json
      - name: Generate Phase 18 evidence
        run: >-
          python scripts/phase18_evidence.py
          --junit .phase18-evidence-input/pytest-results.xml
          --authority-evaluation .phase18-evidence-input/authority-policy-all-report.json
          --selection-evaluation .phase18-evidence-input/authority-selection-all-report.json
          --shadow-report .phase18-evidence-input/authority-shadow-report.json
          --output .phase-evidence/phase18-authority-conflict.json
      - name: Upload Phase 18 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase18-authority-conflict-evidence
          path: .phase-evidence/phase18-authority-conflict.json
          if-no-files-found: error

  phase19-evidence:
    name: Phase 19 compiler V2 evidence
    needs: [bandit, secrets, dependency-audit, docker-security, context-privacy, phase15-evidence, compiler-v2-public]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt defusedxml==0.7.1
      - name: Download runtime test evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .phase19-evidence-input
      - name: Run compiler V2 policy corpus including holdout
        run: >-
          python -m evals.compiler_v2_evaluation --suite all
          --output .phase19-evidence-input/compiler-v2-policy-all-report.json
      - name: Run full V2 selection evaluation
        run: >-
          python -m evals.run --provider compiler-v2 --suite all --corpus-root evals/corpus-v2
          --report .phase19-evidence-input/compiler-v2-selection-all-report.json
      - name: Produce full V2 shadow comparison
        run: >-
          python -m evals.compiler_v2_shadow --suite all --corpus-root evals/corpus-v2
          --output .phase19-evidence-input/compiler-v2-shadow-report.json
      - name: Measure informational V2 compiler performance
        run: >-
          python -m evals.compiler_v2_benchmark
          --output .phase19-evidence-input/compiler-v2-benchmark.json
      - name: Generate Phase 19 evidence
        run: >-
          python scripts/phase19_evidence.py
          --junit .phase19-evidence-input/pytest-results.xml
          --compiler-evaluation .phase19-evidence-input/compiler-v2-policy-all-report.json
          --selection-evaluation .phase19-evidence-input/compiler-v2-selection-all-report.json
          --shadow-report .phase19-evidence-input/compiler-v2-shadow-report.json
          --benchmark .phase19-evidence-input/compiler-v2-benchmark.json
          --output .phase-evidence/phase19-context-compiler-v2.json
      - name: Upload Phase 19 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-context-compiler-v2-evidence
          path: .phase-evidence/phase19-context-compiler-v2.json
          if-no-files-found: error

  context-engine-foundation-graduation:
    name: Context Engine Foundation V1 graduation
    needs: [phase15-evidence, phase16-evidence, phase17-evidence, phase18-evidence, phase19-evidence]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install graduation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest defusedxml==0.7.1
      - name: Run deterministic cross-phase graduation checks
        run: >-
          pytest tests/context_engine tests/test_state_failure_injection.py -m graduation
          --junitxml=foundation-graduation-junit.xml
      - name: Download Phase 15 evidence
        uses: actions/download-artifact@v4
        with:
          name: phase15-evaluation-evidence
          path: .foundation-evidence-input/phase15
      - name: Download Phase 16 evidence
        uses: actions/download-artifact@v4
        with:
          name: phase16-task-state-evidence
          path: .foundation-evidence-input/phase16
      - name: Download Phase 17 evidence
        uses: actions/download-artifact@v4
        with:
          name: phase17-task-aware-router-evidence
          path: .foundation-evidence-input/phase17
      - name: Download Phase 18 evidence
        uses: actions/download-artifact@v4
        with:
          name: phase18-authority-conflict-evidence
          path: .foundation-evidence-input/phase18
      - name: Download Phase 19 evidence
        uses: actions/download-artifact@v4
        with:
          name: phase19-context-compiler-v2-evidence
          path: .foundation-evidence-input/phase19
      - name: Generate revision-bound foundation evidence
        run: >-
          python scripts/context_engine_foundation_evidence.py
          --junit foundation-graduation-junit.xml
          --phase15 .foundation-evidence-input/phase15/phase15-evaluation.json
          --phase16 .foundation-evidence-input/phase16/phase16-task-state.json
          --phase17 .foundation-evidence-input/phase17/phase17-task-aware-router.json
          --phase18 .foundation-evidence-input/phase18/phase18-authority-conflict.json
          --phase19 .foundation-evidence-input/phase19/phase19-context-compiler-v2.json
          --output .phase-evidence/context-engine-foundation-v1.json
      - name: Upload foundation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-engine-foundation-v1-evidence
          path: |
            .phase-evidence/context-engine-foundation-v1.json
            foundation-graduation-junit.xml
          if-no-files-found: error

  quality:
    name: Coverage gate
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pytest-asyncio
      - name: Enforce coverage threshold
        run: |
          pytest tests/ -m "not integration and not graduation" --cov=scripts --cov=context_router --cov=authority --cov=context_compiler_v2 --cov=evals.baseline --cov=evals.router_provider --cov=evals.authority_provider --cov=evals.compiler_v2_provider --cov-report=xml --cov-report=json --cov-report=html --cov-report=term-missing --junitxml=pytest-results.xml
          coverage report --fail-under=80
          python scripts/check_context_engine_coverage.py --coverage coverage.json
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
            coverage.json
            pytest-results.xml

  bandit:
    name: Bandit security scan
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Bandit
        run: python -m pip install --upgrade pip 'bandit[toml]'
      - name: Run Bandit hard gate
        run: bandit -r scripts context_router authority context_compiler_v2 -f json -o bandit-report.json
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  secrets:
    name: Secret detection
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install detect-secrets
        run: python -m pip install --upgrade pip detect-secrets
      - name: Verify reviewed baseline exists
        run: test -f .secrets.baseline
      - name: Reject unreviewed secret candidates
        run: detect-secrets scan --baseline .secrets.baseline

  dependency-audit:
    name: Dependency security check
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run dependency audit hard gate
        run: >-
          python scripts/dependency_audit.py
          --requirements requirements.txt
          --report dependency-audit-report.json
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: dependency-audit-report.json

  docker-security:
    name: Docker image security scan
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: brain-eleven:validation
      - name: Run Trivy hard gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: brain-eleven:validation
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: 'true'
          # Python libraries are hard-gated by pip-audit against the resolved
          # requirements. Limit image scanning to OS packages so deleted,
          # vulnerable records in immutable base layers cannot shadow patched
          # runtime distributions in the final filesystem.
          vuln-type: os
          exit-code: '1'
          ignore-unfixed: 'false'
          trivyignores: .trivyignore
      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  graduation-evidence:
    name: Phase 14 graduation evidence
    needs: [bandit, secrets, dependency-audit, docker-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install evidence parser
        run: python -m pip install --upgrade pip defusedxml==0.7.1
      - name: Download runtime test evidence
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .evidence-input
      - name: Generate evidence after security gates
        run: >-
          python scripts/graduation_evidence.py collect
          --junit .evidence-input/pytest-results.xml
          --coverage .evidence-input/coverage.xml
          --security-status PASS
          --output .phase-evidence/phase14-graduation.json
      - name: Upload graduation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase14-graduation-evidence
          path: .phase-evidence/phase14-graduation.json
