name: Build & Push Docker Image

on:
  workflow_run:
    workflows: [Validation]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-master
  cancel-in-progress: false

jobs:
  build:
    name: Publish validated image
    # Only a successful validation for a direct master push may publish. Pull
    # requests and scheduled validation runs never obtain publish authority.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Confirm the validated commit is the master tip
        id: validated
        run: |
          git fetch origin master --depth=1
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale validated commit $(git rev-parse HEAD)."
          fi
      - name: Set up Docker Buildx
        if: steps.validated.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: steps.validated.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image repository
        if: steps.validated.outputs.current == 'true'
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Extract metadata
        if: steps.validated.outputs.current == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
      - name: Build and push Docker image
        if: steps.validated.outputs.current == 'true'
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:buildcache,mode=max
      - name: Image digest
        if: steps.validated.outputs.current == 'true'
        run: echo ${{ steps.docker_build.outputs.digest }}
