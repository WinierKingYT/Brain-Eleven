name: Release

# Bir v* etiketi itilince: testler, kaynak arşivi, SHA256 özeti, GitHub sürümü.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Etiket pyproject sürümüyle aynı olmalı
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Testler
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest tests -q
      - name: Arşiv ve özet
        run: |
          git archive --format=zip --prefix="Brain-Eleven-$GITHUB_REF_NAME/" -o "Brain-Eleven-$GITHUB_REF_NAME.zip" "$GITHUB_REF_NAME"
          sha256sum "Brain-Eleven-$GITHUB_REF_NAME.zip" > SHA256SUMS
      - name: Sürümü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Brain-Eleven-$GITHUB_REF_NAME.zip" SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
